# The two REAL kind clusters (scripts/k8s/kind-up.sh), as seen from the api
# container on the Docker "kind" network. Credentials are Docker secrets
# (/run/secrets/*, files in the git-ignored .secrets/), never inline.
clusters:
  - name: primary
    role: primary
    prometheus_url: http://primary-control-plane:30090
    # V2.x: replicated banking ledger (workloads/banking/k8s/base/ledger-db.yaml).
    # Superuser password = Docker secret (scripts/dr/make-ledger-secrets.sh).
    data_services:
      - name: banking-ledger
        kind: postgres
        host: primary-control-plane
        port: 30432
        database: ledger
        username: postgres
        password_file: /run/secrets/ledger_postgres_password
        app_role: ledger_app
  - name: secondary
    role: secondary
    # V2: queried through a basic-auth proxy (manifests/prometheus-auth-proxy.yaml)
    prometheus_url: http://secondary-control-plane:30091
    prometheus_auth:
      type: basic
      username: finops
      password_file: /run/secrets/prom_secondary_password
    # Failover actuation (V2): least-privilege ServiceAccount token
    # (manifests/failover-actuator-rbac.yaml, scripts/k8s/make-actuator-secrets.sh)
    kubernetes:
      api_url: https://secondary-control-plane:6443
      token_file: /run/secrets/k8s_secondary_token   # legacy static token: bootstrap fallback only
      ca_file: /run/secrets/k8s_secondary_ca
      # V2.x hardening (docs/DR.md §6): the actuator credential is RENEWED AUTOMATICALLY
      # (TokenRequest). The issuer, bootstrapped once by scripts/k8s/make-actuator-issuer.sh,
      # renews itself every hour (24 h tokens) and re-issues the actuator's 1 h token at
      # 50 % of its lifetime or as soon as it is rejected (e.g. ServiceAccount recreated).
      renewal:
        store_dir: /var/lib/finops/credentials        # writable volume shared by the replicas
        actuator: {namespace: finops-system, service_account: finops-failover-actuator, ttl_seconds: 3600}
        issuer:
          namespace: finops-credentials
          service_account: finops-actuator-issuer
          ttl_seconds: 86400
          renew_every_seconds: 3600
          bootstrap_token_file: /run/secrets/k8s_secondary_issuer_token
    # V2.x: replicated banking ledger (workloads/banking/k8s/base/ledger-db.yaml).
    # Superuser password = Docker secret (scripts/dr/make-ledger-secrets.sh).
    data_services:
      - name: banking-ledger
        kind: postgres
        host: secondary-control-plane
        port: 30432
        database: ledger
        username: postgres
        password_file: /run/secrets/ledger_postgres_password
        app_role: ledger_app

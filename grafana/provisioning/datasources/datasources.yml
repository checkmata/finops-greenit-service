# Grafana datasource provisioning — auto-configures Prometheus and TimescaleDB.
# WHY provisioning (not manual UI setup):
# - Reproducible: every docker compose up starts with identical datasources
# - No human error: no forgetting to add a datasource after restarting
# - Git-tracked: changes to datasources are code-reviewed
# - Production parity: same pattern as OpenShift ConfigMaps for Grafana

apiVersion: 1

datasources:
  # --- Prometheus (scraped metrics from the fake exporter) ---
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"

  # --- TimescaleDB (historical snapshots) ---
  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: finops
    editable: false
    secureJsonData:
      password: finops_dev_password
    jsonData:
      database: finops_greenit
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400

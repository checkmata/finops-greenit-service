# Grafana datasources (provisioned). One Prometheus per (simulated) cluster +
# TimescaleDB for FinOps/GreenIT history. Stable `uid`s are referenced by the
# dashboards in grafana/dashboards/.
apiVersion: 1

datasources:
  - name: Prometheus-primary
    uid: prom-primary
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_PRIMARY_URL}
    isDefault: true
    editable: false
    jsonData: {timeInterval: "10s"}

  - name: Prometheus-secondary
    uid: prom-secondary
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_SECONDARY_URL}
    editable: false
    jsonData: {timeInterval: "10s"}

  - name: TimescaleDB
    uid: timescaledb
    type: postgres
    access: proxy
    url: ${TIMESCALEDB_HOST}:5432   # set by compose; Grafana does not support ${VAR:-default}
    user: finops
    editable: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}   # from the container env (never committed)
    jsonData:
      database: finops_greenit
      sslmode: disable
      timescaledb: true
      postgresVersion: 1600

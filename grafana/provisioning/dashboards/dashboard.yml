# Grafana dashboard provisioning config.
# WHY: tells Grafana where to look for dashboard JSON files.
# Dashboards are generated by scripts/generate_grafana_dashboards.py into grafana/dashboards/.

apiVersion: 1

providers:
  - name: "finops-greenit"
    orgId: 1
    folder: "FinOps"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

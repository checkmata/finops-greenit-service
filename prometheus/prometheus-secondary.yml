# Prometheus of the SIMULATED "secondary" cluster (docker-compose).
# One Prometheus per cluster, like OpenShift's in-cluster monitoring stack.
# Job names match what the service checks with up{job=~"kube-state-metrics|node-exporter|kepler"}.
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    cluster: secondary

scrape_configs:
  - job_name: kube-state-metrics
    static_configs: [{ targets: ["sim-secondary:9101"] }]
  - job_name: node-exporter
    static_configs: [{ targets: ["sim-secondary:9102"] }]
  - job_name: kepler
    static_configs: [{ targets: ["sim-secondary:9103"] }]
  - job_name: kubelet
    static_configs: [{ targets: ["sim-secondary:9104"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

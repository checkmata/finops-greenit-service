# Prometheus scrape config for local dev stack.
# Scrapes the fake-metrics-exporter (simulates cAdvisor + Kepler).
# WHY this file exists:
# - In production, Prometheus auto-discovers targets via Kubernetes SD.
# - Locally, we hardcode the exporter address (no K8s API to query).
# - This is a development-only config — never deployed to OpenShift.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # --- Fake exporter (simulates cAdvisor + Kepler metrics) ---
  - job_name: "fake-exporter"
    static_configs:
      - targets: ["fake-exporter:8000"]

  # --- Prometheus self-monitoring ---
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

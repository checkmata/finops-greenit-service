# OCM placement: WHICH clusters receive WHAT. Clusters are labelled by role
# (`finops.io/role=primary|secondary`, set by scripts/gitops/ocm-up.sh).
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: default
  namespace: argocd
spec:
  clusterSet: default
---
# Every workload cluster (primary active + secondary standby).
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: workload-clusters
  namespace: argocd
spec:
  clusterSets: [default]
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - {key: finops.io/role, operator: In, values: [primary, secondary]}
  # INCIDENT 2026-10-01: during a host OOM, OCM tainted `primary` (unreachable/unavailable,
  # effect NoSelect) → it left the PlacementDecision → the ApplicationSet deleted its
  # Applications → Argo CD cascade-deleted every workload of the failed site.
  # A cluster that is DOWN must stay a target: tolerate both outage taints, with no
  # tolerationSeconds (= for the whole outage). Removing a cluster is a Git decision
  # (its finops.io/role label), never a side effect of a failure.
  tolerations:
    - {key: cluster.open-cluster-management.io/unreachable, operator: Exists}
    - {key: cluster.open-cluster-management.io/unavailable, operator: Exists}

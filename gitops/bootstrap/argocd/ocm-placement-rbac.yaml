# Read-only: the ApplicationSet controller reads PlacementDecisions in `argocd`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ocm-placement-reader
  namespace: argocd
rules:
  - apiGroups: [cluster.open-cluster-management.io]
    resources: [placementdecisions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ocm-placement-reader
  namespace: argocd
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ocm-placement-reader}
subjects:
  - {kind: ServiceAccount, name: argocd-applicationset-controller, namespace: argocd}

# Basic-auth reverse proxy in front of a cluster's Prometheus (V2 — remote,
# authenticated Prometheus). Same pattern as OpenShift's oauth-proxy in front of
# the Thanos Querier. The htpasswd lives in a Secret created OUTSIDE Git:
#   scripts/k8s/make-prometheus-auth.sh <cluster>
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-auth-proxy, namespace: monitoring}
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        auth_basic "prometheus";
        auth_basic_user_file /etc/nginx/htpasswd/htpasswd;
        proxy_pass http://prometheus-operated.monitoring.svc:9090;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus-auth-proxy, namespace: monitoring, labels: {app: prometheus-auth-proxy}}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus-auth-proxy}}
  template:
    metadata: {labels: {app: prometheus-auth-proxy}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
            - {name: htpasswd, mountPath: /etc/nginx/htpasswd, readOnly: true}
      volumes:
        - {name: conf, configMap: {name: prometheus-auth-proxy}}
        - {name: htpasswd, secret: {secretName: prometheus-htpasswd}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus-auth-proxy, namespace: monitoring}
spec:
  type: NodePort
  selector: {app: prometheus-auth-proxy}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30091}]

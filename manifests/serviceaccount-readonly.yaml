# =============================================================================
# ServiceAccount — least-privilege identity for the finops-greenit-service pod
# =============================================================================
# WHY a dedicated ServiceAccount:
#   - Principle of least privilege: this pod gets ONLY the permissions it needs
#   - The default SA in a namespace often has more permissions than necessary
#   - Makes RBAC audit trail clear: "who can query Prometheus?"
#
# WHY not cluster-admin or any broad role:
#   - The service only READS Prometheus metrics (no write, no secrets, no RBAC)
#   - A dedicated ClusterRole with only "get/list/watch" on metrics proves this
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: finops-greenit
  namespace: finops-greenit
  labels:
    app.kubernetes.io/name: finops-greenit-service
    app.kubernetes.io/part-of: finops-greenit
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: kubectl
automountServiceAccountToken: true
# WHY automountServiceAccountToken: true:
#   - The pod needs to call the Prometheus API via the Kubernetes API server
#   - The token is mounted at /var/run/secrets/kubernetes.io/serviceaccount/token
#   - httpx uses this token for authentication when querying Prometheus
#   - Set to false only if the service makes NO Kubernetes API calls
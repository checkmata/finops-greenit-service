# EXAMPLE ONLY (V1): the MVP committed base64 dev credentials here.
# Never commit real values. This file is not applied as-is.
# =============================================================================
# Secret — application secrets (DATABASE_URL, etc.)
# =============================================================================
# WHY a separate Secret for the app (not just the TimescaleDB Secret):
#   - The app needs DATABASE_URL with the password embedded
#   - The TimescaleDB Secret has individual env vars (POSTGRES_USER, etc.)
#   - Different consumers need different secret formats
#   - Keeping them separate means: rotating DB password = update 2 Secrets
#
# DATABASE_URL format:
#   postgresql://finops:<password>@timescaledb-svc.finops-greenit.svc:5432/finops_greenit
#
# The password in this Secret MUST match the one in timescaledb-secret.yaml
#
# To create manually:
#   kubectl create secret generic finops-greenit-secrets \
#     --from-literal=DATABASE_URL="postgresql://finops:CHANGE_ME@timescaledb-svc.finops-greenit.svc.cluster.local:5432/finops_greenit" \
#     -n finops-greenit
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: finops-greenit-secrets
  namespace: finops-greenit
  labels:
    app.kubernetes.io/name: finops-greenit-service
    app.kubernetes.io/part-of: finops-greenit
    app.kubernetes.io/component: secrets
type: Opaque
  # Create the real Secret OUT of Git, e.g.:
  #   oc -n finops-greenit create secret generic finops-greenit-secrets \
  #     --from-literal=DATABASE_URL='postgresql://finops:<password>@timescaledb-svc.finops-greenit.svc.cluster.local:5432/finops_greenit'
  # or use a secret manager (Vault, External Secrets Operator, Sealed Secrets).
stringData:
  DATABASE_URL: "postgresql://finops:CHANGE_ME@timescaledb-svc.finops-greenit.svc.cluster.local:5432/finops_greenit"

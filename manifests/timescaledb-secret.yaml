# =============================================================================
# Secret — TimescaleDB credentials
# =============================================================================
# WHY a Secret (not ConfigMap):
#   - Contains the database password (sensitive data)
#   - Kubernetes encrypts Secrets at rest (if encryption is configured)
#   - Secrets are only mounted as files or env vars (not visible in kubectl get)
#
# WHY base64-encoded (not encrypted):
#   - base64 is encoding, NOT encryption — anyone can decode it
#   - For real security: enable at-rest encryption, or use Sealed Secrets/Vault
#   - This is the standard Kubernetes pattern for dev/staging environments
#
# IMPORTANT: For production, use one of:
#   - OpenShift's built-in Secret encryption
#   - HashiCorp Vault (via CSI driver)
#   - Sealed Secrets (encrypted in git)
#   - External Secrets Operator
#
# To create manually (instead of applying this YAML):
#   kubectl create secret generic timescaledb-credentials \
#     --from-literal=POSTGRES_USER=finops \
#     --from-literal=POSTGRES_PASSWORD=CHANGE_ME_IN_PRODUCTION \
#     --from-literal=POSTGRES_DB=finops_greenit \
#     -n finops-greenit
#
# To encode: echo -n "value" | base64
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: timescaledb-credentials
  namespace: finops-greenit
  labels:
    app.kubernetes.io/name: timescaledb
    app.kubernetes.io/part-of: finops-greenit
    app.kubernetes.io/component: database
type: Opaque
data:
  # Default credentials for dev/staging — CHANGE FOR PRODUCTION
  POSTGRES_USER: Zmlub3Bz            # base64 of "finops"
  POSTGRES_PASSWORD: Zmlub3BzX2Rldl9wYXNzd29yZA==  # base64 of "finops_dev_password"
  POSTGRES_DB: Zmlub3BzX2dyZWVuaXQ=  # base64 of "finops_greenit"